name: Update AniSkip database

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
    inputs:
      full_scan:
        description: Check every known and missing episode
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: aniskip-database-update
  cancel-in-progress: false

jobs:
  update-shards:
    name: Update shard ${{ matrix.shard }} of 8
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update assigned shard
        env:
          FULL_SCAN: ${{ inputs.full_scan || 'false' }}
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
          PYTHONUNBUFFERED: "1"
        run: |
          args=()
          if [[ "$FULL_SCAN" == "true" ]]; then args+=(--full); fi
          python scripts/update_aniskip.py \
            --concurrency 4 \
            --shard-index "${{ matrix.shard }}" \
            --shard-count 8 \
            "${args[@]}"

      - name: Validate shard JSON
        run: python -m json.tool aniskip_data.json > /dev/null

      - name: Upload shard result
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: aniskip_data.json
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge and commit shards
    needs: update-shards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download all shard results
        uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: shard-results

      - name: Merge shards
        run: python scripts/merge_shards.py --shard-count 8

      - name: Validate merged JSON
        run: python -m json.tool aniskip_data.json > /dev/null

      - name: Commit real changes only
        run: |
          if git diff --quiet -- aniskip_data.json; then
            echo "AniSkip has no new or changed timestamps."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aniskip_data.json
          git commit -m "chore: update AniSkip database"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
